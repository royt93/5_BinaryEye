apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def ksExternalDir = localProps.getProperty("KS_EXTERNAL_DIR",
        "${System.getProperty("user.home")}/AndroidStudioProjects/@mckimquyen/myKeyStore/com.mckimquyen.binaryeye")
def externalPropsFile = new File(ksExternalDir, "keystore.properties")

// Keys needed for EVERY variant (they're defaultConfig buildConfigFields — even a debug/unit-test
// compile needs real values so BuildConfig.java carries them correctly), vs. keys only needed when
// actually signing/packaging a release build. Splitting this lets `testDevDebugUnitTest`,
// `lintDevDebug`, etc. run without requiring the release keystore — only assemble*Release/bundle*Release
// (or any task name containing "release"/"bundle") demand the signing + AdMob-release keys.
def ALWAYS_REQUIRED_EXTERNAL_KEYS = [
        "vipKeySecret", "vipRedeemCode3Day", "vipRedeemCode30Day",
        "applovinSdkKey", "applovinBannerId", "applovinInterstitialId", "applovinAppOpenId", "applovinRewardedId"
]
def RELEASE_ONLY_EXTERNAL_KEYS = [
        "storeFile", "storePassword", "keyAlias", "keyPassword",
        "admobBannerIdRelease", "admobInterstitialIdRelease", "admobAppOpenIdRelease"
]
def isReleaseTaskRequested = gradle.startParameter.taskNames.any {
    def n = it.toLowerCase()
    n.contains("release") || n.contains("bundle")
}

if (!externalPropsFile.exists()) {
    throw new GradleException(
        "Missing ${externalPropsFile} — clone github.com/royt93/myKeyStore next to this project, " +
        "or set KS_EXTERNAL_DIR in local.properties to point at your clone of it."
    )
}
def externalProps = new Properties()
externalProps.load(new FileInputStream(externalPropsFile))

def missingAlwaysKeys = ALWAYS_REQUIRED_EXTERNAL_KEYS.findAll { !externalProps.getProperty(it) }
if (!missingAlwaysKeys.isEmpty()) {
    throw new GradleException("Missing key(s) in ${externalPropsFile}: ${missingAlwaysKeys.join(', ')}")
}
if (isReleaseTaskRequested) {
    def missingReleaseKeys = RELEASE_ONLY_EXTERNAL_KEYS.findAll { !externalProps.getProperty(it) }
    if (!missingReleaseKeys.isEmpty()) {
        throw new GradleException(
            "Missing key(s) required for a release build in ${externalPropsFile}: ${missingReleaseKeys.join(', ')}"
        )
    }
}
def externalKeystoreFile = externalProps.getProperty("storeFile") ?
        new File(ksExternalDir, externalProps.getProperty("storeFile")) : null

android {
    namespace 'com.mckimquyen.binaryeye'
    compileSdkVersion 37
    defaultConfig {
        applicationId "com.mckimquyen.binaryeye"
        minSdkVersion 24
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 37
        versionCode 20270822
        versionName '2026.08.22'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "APPLOVIN_SDK_KEY",        "\"${externalProps.getProperty('applovinSdkKey')}\""
        buildConfigField "String", "APPLOVIN_BANNER_ID",      "\"${externalProps.getProperty('applovinBannerId')}\""
        buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID","\"${externalProps.getProperty('applovinInterstitialId')}\""
        buildConfigField "String", "APPLOVIN_APP_OPEN_ID",    "\"${externalProps.getProperty('applovinAppOpenId')}\""
        buildConfigField "String", "APPLOVIN_REWARDED_ID",    "\"${externalProps.getProperty('applovinRewardedId')}\""
        buildConfigField "String", "VIP_KEY_SECRET",          "\"${externalProps.getProperty('vipKeySecret')}\""
        buildConfigField "String", "VIP_REDEEM_CODE_3_DAY",   "\"${externalProps.getProperty('vipRedeemCode3Day')}\""
        buildConfigField "String", "VIP_REDEEM_CODE_30_DAY",  "\"${externalProps.getProperty('vipRedeemCode30Day')}\""
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    bundle {
        language {
            enableSplit = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    signingConfigs {
        release {
            storeFile externalKeystoreFile
            storePassword externalProps.getProperty("storePassword")
            keyAlias externalProps.getProperty("keyAlias")
            keyPassword externalProps.getProperty("keyPassword")
        }
    }

    buildTypes {
        release {
            buildConfigField "String", "ADMOB_BANNER_ID",       "\"${externalProps.getProperty('admobBannerIdRelease')}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${externalProps.getProperty('admobInterstitialIdRelease')}\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID",     "\"${externalProps.getProperty('admobAppOpenIdRelease')}\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"

            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            buildConfigField "String", "ADMOB_BANNER_ID",       "\"${ADMOB_BANNER_ID_DEBUG}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${ADMOB_INTERSTITIAL_ID_DEBUG}\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID",     "\"${ADMOB_APP_OPEN_ID_DEBUG}\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = defaultConfig.applicationId + buildType.name + "_" + defaultConfig.versionName + "_" + defaultConfig.versionCode + ".apk"
        }
    }

    flavorDimensions.add("type")
    productFlavors {
        dev {
            dimension "type"
            buildConfigField "String", "FLAVOR_buildEnv", '"dev"'
            resValue "string", "app_name", "Cat Scanner with history DEV"
        }
        production {
            dimension "type"
            buildConfigField "String", "FLAVOR_buildEnv", '"prod"'
            resValue "string", "app_name", "Cat Scanner with history"
        }
    }
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'com.google.android.material:material:1.12.0'
    api 'androidx.preference:preference-ktx:1.2.1'
    api 'androidx.legacy:legacy-preference-v14:1.0.0'
    api 'com.github.markusfisch:CameraView:1.9.1'
    api 'com.github.markusfisch:ScalingImageView:1.4.1'
    // ZXing-CPP v2.3.0.4 with 16KB page size support — keep ≥ this for Android 15+ compatibility
    api 'com.github.markusfisch:zxing-cpp:v2.3.0.4'
    // [FEAT F8] Biometric lock cho History (VIP-exclusive)
    api 'androidx.biometric:biometric:1.1.0'

    implementation "com.github.royt93:AdmobApplovinWrapper:1.1.3"

    implementation "com.google.android.play:review:2.0.2"
    implementation "com.google.android.play:review-ktx:2.0.2"
    implementation 'com.airbnb.android:lottie:6.1.0'

    // Unit (JVM)
    testImplementation 'junit:junit:4.13.2'
    // Widget (Robolectric — chạy trên JVM, không cần device)
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'com.google.android.material:material:1.12.0'
    // Integration (instrumented + Espresso — chạy trên device/emulator)
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
