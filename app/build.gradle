apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def ksExternalPath = localProps.getProperty("KS_EXTERNAL_PATH",
        "${System.getProperty("user.home")}/AndroidStudioProjects/@mckimquyen/myKeyStore/com.mckimquyen.binaryeye/keystore.jks")

android {
    namespace 'com.mckimquyen.binaryeye'
    compileSdkVersion 37
    defaultConfig {
        applicationId "com.mckimquyen.binaryeye"
        minSdkVersion 24
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 37
        versionCode 20270822
        versionName '2026.08.22'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "APPLOVIN_SDK_KEY",        "\"${localProps.getProperty('APPLOVIN_SDK_KEY', '')}\""
        buildConfigField "String", "APPLOVIN_BANNER_ID",      "\"${localProps.getProperty('APPLOVIN_BANNER_ID', '')}\""
        buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID","\"${localProps.getProperty('APPLOVIN_INTERSTITIAL_ID', '')}\""
        buildConfigField "String", "APPLOVIN_APP_OPEN_ID",    "\"${localProps.getProperty('APPLOVIN_APP_OPEN_ID', '')}\""
        buildConfigField "String", "APPLOVIN_REWARDED_ID",    "\"${localProps.getProperty('APPLOVIN_REWARDED_ID', '')}\""
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    bundle {
        language {
            enableSplit = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    signingConfigs {
        release {
            storeFile file(ksExternalPath)
            storePassword localProps.getProperty("KS_PW")
            keyAlias localProps.getProperty("KS_ALIAS")
            keyPassword localProps.getProperty("KS_PW")
        }
    }

    buildTypes {
        release {
            buildConfigField "String", "ADMOB_BANNER_ID",       "\"${ADMOB_BANNER_ID_RELEASE}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${ADMOB_INTERSTITIAL_ID_RELEASE}\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID",     "\"${ADMOB_APP_OPEN_ID_RELEASE}\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"

            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            buildConfigField "String", "ADMOB_BANNER_ID",       "\"${ADMOB_BANNER_ID_DEBUG}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${ADMOB_INTERSTITIAL_ID_DEBUG}\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID",     "\"${ADMOB_APP_OPEN_ID_DEBUG}\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = defaultConfig.applicationId + buildType.name + "_" + defaultConfig.versionName + "_" + defaultConfig.versionCode + ".apk"
        }
    }

    flavorDimensions.add("type")
    productFlavors {
        dev {
            dimension "type"
            buildConfigField "String", "FLAVOR_buildEnv", '"dev"'
            resValue "string", "app_name", "Cat Scanner with history DEV"
        }
        production {
            dimension "type"
            buildConfigField "String", "FLAVOR_buildEnv", '"prod"'
            resValue "string", "app_name", "Cat Scanner with history"
        }
    }
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'com.google.android.material:material:1.12.0'
    api 'androidx.preference:preference-ktx:1.2.1'
    api 'androidx.legacy:legacy-preference-v14:1.0.0'
    api 'com.github.markusfisch:CameraView:1.9.1'
    api 'com.github.markusfisch:ScalingImageView:1.4.1'
    // ZXing-CPP v2.3.0.4 with 16KB page size support — keep ≥ this for Android 15+ compatibility
    api 'com.github.markusfisch:zxing-cpp:v2.3.0.4'

    implementation "com.github.royt93:AdmobApplovinWrapper:1.1.3"

    implementation "com.google.android.play:review:2.0.2"
    implementation "com.google.android.play:review-ktx:2.0.2"
    implementation 'com.airbnb.android:lottie:6.1.0'

    // Unit (JVM)
    testImplementation 'junit:junit:4.13.2'
    // Widget (Robolectric — chạy trên JVM, không cần device)
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'com.google.android.material:material:1.12.0'
    // Integration (instrumented + Espresso — chạy trên device/emulator)
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
